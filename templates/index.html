<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Puissance 4</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Écran de démarrage avec l'image Start Game -->
    <div class="start-screen" id="startScreen">
        <img src="/static/images/start_game.svg" alt="Start Game" class="start-game-image">
        <button class="play-button" onclick="startGame()">Jouer</button>
    </div>

    <!-- Contenu du jeu (caché au démarrage) -->
    <div class="game-content" id="gameContent" style="display: none;">
        <div class="logo">
            <img src="/static/images/logo.png" alt="Logo Puissance 4" width="200">
        </div>
        <h1>Puissance 4</h1>

    <div class="status">
        {{ if .GameOver }}
            {{ if eq .Winner 0 }}
                Partie terminée : Match nul !
            {{ else }}
                Le joueur {{ .Winner }} a gagné !
            {{ end }}
        {{ else }}
            Au tour du joueur {{ .Current }}
        {{ end }}
    </div>

    <div class="board-container">
        <table>
            {{ range $i, $row := .Board }}
            <tr>
                {{ range $j, $cell := $row }}
                <td data-column="{{ $j }}" class="{{ if eq $cell 1 }}player1{{ else if eq $cell 2 }}player2{{ end }}"></td>
                {{ end }}
            </tr>
            {{ end }}
        </table>
    </div>

        <div class="reset-button">
            <form method="POST" action="/reset">
                <button type="submit">Recommencer</button>
            </form>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
